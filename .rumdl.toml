[global]
flavor = "gfm"
respect-gitignore = true
include = ["**/*.md", "**/*.markdown"]
exclude = ["node_modules", "dist", "build", "target", ".rumdl_cache"]
line-length = 100

[MD003]
style = "atx"

[MD004]
style = "dash"

[MD007]
indent = 2

[MD013]
line-length = 100
code-blocks = false
tables = false
reflow = true

[MD048]
style = "backtick"
